[project]
name = "9gag-notion-scraper"
version = "0.1.0"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.12,<3.14"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "selenium",
    "notion-client",
    "python-dotenv",
    "validators",
    "requests",
    "retry",
    "latest-user-agents",
    "pydantic",
    "pydantic-settings>=2.9.1,<3",
]

[dependency-groups]
dev = [
    "types-requests",
    "types-retry",
]

[tool.uv]
package = false
default-groups = "all"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
